name: 'PR Comment Handler'
description: 'Gets PR details, refuses forks and commenters without write access, and checks out the PR head SHA'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true

outputs:
  pr-number:
    description: 'Pull request number'
    value: ${{ steps.get-pr.outputs.pr-number }}
  pr-ref:
    description: 'Pull request branch ref'
    value: ${{ steps.get-pr.outputs.pr-ref }}
  pr-sha:
    description: 'Pull request HEAD SHA'
    value: ${{ steps.get-pr.outputs.pr-sha }}
  pr-repo:
    description: 'Pull request repository full name'
    value: ${{ steps.get-pr.outputs.pr-repo }}
  refused:
    description: 'Reason the request was refused (PR from a fork, or commenter without write access); empty when allowed'
    value: ${{ steps.get-pr.outputs.refused }}

runs:
  using: 'composite'
  steps:
    - name: Get PR details
      id: get-pr
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { owner, repo } = context.repo;
          const { data: pullRequest } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: context.issue.number
          });

          // Set the PR outputs first so the caller's failure-comment steps still work on refusal.
          core.setOutput('pr-number', context.issue.number);
          core.setOutput('pr-ref', pullRequest.head.ref);
          core.setOutput('pr-sha', pullRequest.head.sha);
          core.setOutput('pr-repo', pullRequest.head.repo.full_name);

          const refuse = (reason) => { core.setOutput('refused', reason); core.setFailed(reason); };

          if (pullRequest.head.repo.full_name !== `${owner}/${repo}`) {
            return refuse('the PR comes from a fork');
          }

          const commenter = context.payload.comment.user.login;
          const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
            owner,
            repo,
            username: commenter
          });
          if (!['admin', 'maintain', 'write'].includes(perm.role_name)) {
            return refuse(`@${commenter} has no write access`);
          }

    - name: Checkout PR
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.get-pr.outputs.pr-sha }}
        persist-credentials: false
